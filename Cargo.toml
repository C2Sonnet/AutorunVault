[package]
name = "kiseki_autorun_vault"
version = "1.2.0"
edition = "2021"
build = "build.rs"
license = "CC-BY-SA-4.0"
description = "Preview and archive Autorun.ico and Autorun.inf from Windows drives"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
png = "0.17"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[package.metadata.winres]
OriginalFilename = "kiseki_autorun_vault.exe"
ProductName = "Kiseki Autorun Vault"
FileDescription = "Kiseki Autorun Vault | キセキのオートラン書庫"
LegalCopyright = "Copyright (c) 2026 Chiaroscuro Sonnet"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
